# ========================================
# ACS - Configuration des classes
# ========================================

types:
  - crocodile
  - ourson
  - fraise
  - oeuf

# Étiquettes des couleurs et variantes
couleurs:
  - bleu
  - jaune
  - orange
  - rouge
  - vert
  - blanc
  - rougefaible
  - rougefort

# Combinaisons autorisées
variantes:

  crocodile:
    - bleu
    - jaune
    - orange
    - rouge
    - vert

  ourson:
    - blanc
    - jaune
    - orange
    - rougefaible
    - rougefort
    - vert

  fraise:
    - rouge

  oeuf:
    - blanc

# Règles spécifiques d'annotation
regles_annotation:

  ourson:
    critere: nuance_de_rouge
    description: >
      Les variantes rougefaible et rougefort
      représentent deux nuances distinctes
      identifiées lors de la collecte.
