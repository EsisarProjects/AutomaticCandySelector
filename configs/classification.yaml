# ==========================================
# ACS - Classification Configuration
# ==========================================

split:
  train:
    - S01

  val:
    - S02

  test:
    - S03

training:
  seed: 42

  # Chargement des données
  batch_size: 4
  num_workers: 0
  preprocessing_method: center_crop

  # Modèle
  mode: linear_probe

  # Optimisation
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001

  # Early Stopping
  patience: 5

  # Matériel
  device: auto